\* TLC configuration: a stray timer.
\*
\* EXPECTED: NoStrayTimer is violated, by the same resend-against-reply race
\* that Concurrent now holds through. A resend arms the timer and the reply for
\* that same SURB id then completes the operation, so the timer is left armed on
\* an operation no longer tracked. It is harmless: when it fires nothing is
\* found.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = FALSE
    Disconnects = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NoStrayTimer
