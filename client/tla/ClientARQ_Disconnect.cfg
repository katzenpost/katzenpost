\* TLC configuration: disconnect and resume, properties that survive.
\*
\* EXPECTED: all invariants hold. In particular no operation is forgotten
\* without a reply across a disconnect and a resume, and none is left tracked
\* with nothing scheduled: onClosedConn drains the resend queue back onto the
\* timer, and a reply inside the grace period is handled and queued for the
\* client's return.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT CompletionMatchesKind
INVARIANT NoSilentDrop
INVARIANT NoOrphan
INVARIANT AtMostOneResponse
INVARIANT CancelIsFinal
INVARIANT NoStrayTimer
