\* TLC configuration: the protocol alone.
\*
\* Reply handling is atomic and the thin client stays connected. This is the
\* setting the protocol was designed for.
\*
\* EXPECTED: all invariants hold.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = FALSE

INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT CompletionMatchesKind
INVARIANT AtMostOneResponse
INVARIANT NoSilentDrop
INVARIANT NoOrphan
INVARIANT CancelIsFinal
INVARIANT NoStrayTimer
