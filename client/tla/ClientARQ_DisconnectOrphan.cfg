\* TLC configuration: disconnect and resume, stuck operation.
\*
\* Reply handling is atomic; the thin client may disconnect and resume.
\*
\* EXPECTED: NoOrphan is violated. A resend is queued and the client then
\* disconnects, taking resendCh with the connection and leaving no timer.
\* After the client resumes the operation is still tracked but will never be
\* re-sent. A reply arriving while the client is away reaches the same
\* violation: looking it up cancels the timer and the handler then returns
\* for lack of a connection.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NoOrphan
