\* TLC configuration: disconnect and resume, stuck operation.
\*
\* Reply handling is atomic; the thin client may disconnect and resume.
\*
\* EXPECTED: NoOrphan is violated. While the client is away a reply arrives.
\* Looking it up cancels the retry timer, and the handler then returns for
\* lack of a connection. After the client resumes the operation is still
\* tracked but will never be re-sent.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = TRUE

INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT NoOrphan
