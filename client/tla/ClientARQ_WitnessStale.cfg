\* TLC configuration: witness of a stale reply.
\*
\* EXPECTED: NeverStale is violated. The counterexample is a reply that
\* arrives under a SURB id the operation has rotated away from.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = FALSE

INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT NeverStale
