\* TLC configuration: concurrent goroutines, properties that survive.
\*
\* Anything may run between the lookup of a reply and its handling. The thin
\* client stays connected.
\*
\* EXPECTED: all invariants hold. In particular a rotation never undoes a
\* cancel, because arqDoResend looks the operation up before it rotates, and no
\* operation is forgotten without a reply: a reply that arrives after a rotation
\* fails to decrypt and arms the timer again rather than deleting it.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = FALSE
    Disconnects = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT CompletionMatchesKind
INVARIANT CancelIsFinal
INVARIANT NoOrphan
INVARIANT NoSilentDrop
