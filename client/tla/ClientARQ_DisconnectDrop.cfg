\* TLC configuration: disconnect and resume, lost operation.
\*
\* Reply handling is atomic; the thin client may disconnect and resume.
\*
\* EXPECTED: NoSilentDrop is violated. A resend is queued, the client
\* disconnects, and arqDoResend deletes the operation. The session is still
\* within its grace period, and after the client resumes the operation is
\* gone without a reply.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT NoSilentDrop
