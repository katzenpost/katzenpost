\* TLC configuration: the cancel / reply race.
\*
\* EXPECTED: AtMostOneResponse is violated. The ingress worker finds the
\* operation, the application cancels it and is sent a Cancelled reply, and
\* the worker then completes the operation and sends a second reply.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = FALSE
    Disconnects = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT AtMostOneResponse
