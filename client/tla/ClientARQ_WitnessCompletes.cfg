\* TLC configuration: witness of a normal completion.
\*
\* EXPECTED: NeverCompletes is violated. The counterexample is an idempotent
\* write that completes on its ACK with exactly one reply.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = FALSE

INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT NeverCompletes
