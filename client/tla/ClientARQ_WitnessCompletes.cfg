\* TLC configuration: witness of a normal completion.
\*
\* EXPECTED: NeverCompletes is violated. The counterexample is an operation
\* that is ACKed, polls again, and completes on the payload with exactly one
\* reply.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = TRUE
    Disconnects = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NeverCompletes
