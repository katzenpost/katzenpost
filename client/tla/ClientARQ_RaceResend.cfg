\* TLC configuration: the resend / reply race.
\*
\* EXPECTED: NoSilentDrop is violated. The ingress worker finds the
\* operation, the egress worker rotates it to a fresh SURB and fresh keys, and
\* the worker then fails to decrypt the reply and deletes the operation. The
\* application is never answered.

CONSTANTS
    Msgs        = {m1, m2}
    MaxRetx     = 2
    Atomic      = FALSE
    Disconnects = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NoSilentDrop
