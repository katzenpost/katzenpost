name: tla models

on:
  pull_request:
    paths:
      - 'authority/voting/tla/**'
      - 'client/tla/**'
      - 'server/tla/**'
      - '.ci/tla.sh'
      - 'Makefile'
      - '.github/workflows/tla.yml'
  push:
    branches: [main]
    paths:
      - 'authority/voting/tla/**'
      - 'client/tla/**'
      - 'server/tla/**'
      - '.ci/tla.sh'
      - 'Makefile'
      - '.github/workflows/tla.yml'
  workflow_dispatch:

jobs:
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: make tla
