name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian-13, image: 'debian:13' }
          - { distro: debian-forky, image: 'debian:forky' }
          - { distro: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { distro: ubuntu-26.04, image: 'ubuntu:26.04' }
    container: docker.io/${{ matrix.image }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: packaging/debian/ci.sh
      - run: |
          mkdir out
          for p in kpclientd katzenpost; do
            cp dist/${p}_*_amd64.deb out/${p}_${{ matrix.distro }}_amd64.deb
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}
          path: out/*

  kpclientd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux_amd64, runner: ubuntu-24.04 }
          - { name: linux_arm64, runner: ubuntu-24.04-arm }
          - { name: darwin_arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
      - run: make kpclientd
      - run: |
          d=kpclientd_${{ matrix.name }}
          mkdir "$d"
          cp cmd/kpclientd/kpclientd LICENSE "$d"/
          "$d"/kpclientd --help >/dev/null
          # The packaged configs listen on @katzenpost, a Linux abstract socket.
          if [ "$RUNNER_OS" = Linux ]; then
            cp debian/kpclientd.toml debian/thinclient.toml "$d"/
            "$d"/kpclientd -c "$d"/kpclientd.toml --validate-only
          fi
          tar -czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: kpclientd-${{ matrix.name }}
          path: kpclientd_${{ matrix.name }}.tar.gz

  kpclientd-windows:
    runs-on: windows-2022
    env:
      HIGHCTIDH_PORTABLE: 1
      CGO_ENABLED: 1
      CGO_LDFLAGS: "-Wl,--no-as-needed -Wl,-allow-multiple-definition"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc
            make
            git
            gcc
      - shell: msys2 {0}
        run: make kpclientd
      # Run outside msys2 so a missing MinGW DLL fails here, not on a user's machine.
      - shell: pwsh
        run: |
          $d = "kpclientd_windows_amd64"
          New-Item -ItemType Directory $d
          Copy-Item cmd/kpclientd/kpclientd.exe, LICENSE $d
          & "$d/kpclientd.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kpclientd-windows_amd64
          path: kpclientd_windows_amd64.zip

  release:
    if: github.ref_type == 'tag'
    needs: [deb, kpclientd, kpclientd-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: make check-version tag="$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: (cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
