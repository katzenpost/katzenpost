name: docker quic testnet
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
concurrency:
  group: docker-quic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      quic: ${{ steps.quic.outputs.quic }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: quic
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "quic=$(sh .github/quic-changed.sh "$BASE" "$HEAD" "$LABELS")" >> "$GITHUB_OUTPUT"
          else
            echo "quic=true" >> "$GITHUB_OUTPUT"
          fi
  quic:
    needs: changes
    if: needs.changes.outputs.quic == 'true'
    uses: ./.github/workflows/docker-mixnet.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      transports: '["TCP+QUIC", "QUIC"]'
