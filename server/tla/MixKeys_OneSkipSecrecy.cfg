    Tags     = {t1, t2}
    MaxEpoch = 6
    MaxSkips = 1
    Restarts = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT KeysDestroyedOnTime
