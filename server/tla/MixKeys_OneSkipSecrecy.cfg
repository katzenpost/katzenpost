\* TLC configuration: one epoch may pass without the publish step.
\*
\* EXPECTED: KeysDestroyedOnTime is violated. Pruning happens only inside the
\* publish step. After an epoch without it, the oldest key is still there
\* when it should be gone.

CONSTANTS
