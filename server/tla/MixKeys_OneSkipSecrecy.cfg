\* TLC configuration: one epoch may pass without the publish step.
\*
\* EXPECTED: KeysDestroyedOnTime is violated. Pruning happened only inside the
\* publish step at e17bffb95, so after an epoch without it the oldest key is still
\* there when it should be gone. The worker now rotates every pass; this models the
\* code as it was and is why that changed.

CONSTANTS
    Workers  = {w1, w2}
    Tags     = {t1, t2}
    MaxEpoch = 6
    MaxSkips = 1
    Restarts = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT KeysDestroyedOnTime
