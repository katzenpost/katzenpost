\* TLC configuration: one epoch may pass without a descriptor being published.
\*
\* EXPECTED: all invariants hold. Rotation is the first statement of
\* publishDescriptorIfNeeded, ahead of every early return, so an epoch that
\* publishes nothing still generates and prunes: the node has the keys it needs
\* and the oldest key is gone when it should be. Pruning happened only inside
\* the publish step at e17bffb95, where this configuration broke forward
\* secrecy.

CONSTANTS
    Workers  = {w1, w2}
    Tags     = {t1, t2}
    MaxEpoch = 6
    MaxSkips = 1
    Restarts = FALSE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT ReplayFreedom
INVARIANT KeysDestroyedOnTime
INVARIANT KeysAvailable
