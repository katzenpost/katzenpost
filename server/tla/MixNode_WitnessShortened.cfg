\* TLC configuration: the wait for a crypto worker counts towards the delay.
\*
\* EXPECTED: NeverShortened is violated. The counterexample is a packet that
\* waited for a crypto worker, and that the scheduler then held for less than
\* the delay its sender asked for.

CONSTANTS
    Packets        = {p1, p2}
    MaxTick        = 5
    UnwrapDelay    = 2
    SchedulerSlack = 1
    MaxDelay       = 3

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NeverShortened
