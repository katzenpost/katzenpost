\* TLC configuration: the packet pipeline, for all three roles of a node.
\*
\* EXPECTED: all invariants hold.

CONSTANTS
    Packets        = {p1, p2}
    MaxTick        = 5
    UnwrapDelay    = 2
    SchedulerSlack = 1
    MaxDelay       = 3

INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT MinimumMixing
INVARIANT ClientPacketsAreMixed
INVARIANT ServiceNodeTerminates
INVARIANT MixHasNoBackend
INVARIANT PlaceMatchesCommand
