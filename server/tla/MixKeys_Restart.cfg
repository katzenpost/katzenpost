\* TLC configuration: the node may shut down cleanly and boot again with its
\* keys saved. Properties that survive.
\*
\* EXPECTED: all invariants hold. A node that boots has the keys it needs.
\*
\* There are no packets here. Whether a key exists does not depend on them,
\* and with restarts they multiply the states.

CONSTANTS
    Workers  = {w1, w2}
    Tags     = {}
    MaxEpoch = 6
    MaxSkips = 0
    Restarts = TRUE

INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT KeysAvailable
