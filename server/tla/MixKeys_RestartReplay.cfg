\* TLC configuration: a restart with saved keys, and replays.
\*
\* EXPECTED: ReplayFreedom is violated. A packet is accepted, the node shuts
\* down and boots with the same key, and the same packet is accepted again.
\* The file holds the private key and not the replay filter.

CONSTANTS
    Workers  = {w1, w2}
    Tags     = {t1, t2}
    MaxEpoch = 6
    MaxSkips = 0
    Restarts = TRUE

INIT Init
NEXT Next
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT ReplayFreedom
