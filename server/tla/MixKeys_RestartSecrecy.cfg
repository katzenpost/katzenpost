\* TLC configuration: a restart with saved keys, and forward secrecy.
\*
\* EXPECTED: KeysDestroyedOnTime is violated. While the node is down its key
\* files stay where they are. If it stays down for long enough, a key is
\* still on disk when it should be gone.
\*
\* There are no packets here. Whether a key exists does not depend on them,
\* and with restarts they multiply the states.

CONSTANTS
    Workers  = {w1, w2}
    Tags     = {}
    MaxEpoch = 6
    MaxSkips = 0
    Restarts = TRUE

SPECIFICATION Spec
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT KeysDestroyedOnTime
