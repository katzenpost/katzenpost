\* TLC configuration: one Byzantine authority among five.
\*
\* Threshold is 3, so two quorums need overlap in only 1 authority, and the
\* Byzantine one can be that authority. EXPECTED: TLC reports an Agreement
\* counterexample. Going from four authorities to five makes Byzantine
\* agreement worse, not better.
\*
\* The instance is too large to search exhaustively, so vote delivery is
\* restricted to MinimalVoteChoices. That is sound for finding a
\* counterexample, see the comment on MinimalVoteChoices.

CONSTANTS
    Auths     = {a1, a2, a3, a4, a5}
    Byzantine = {a5}
    Nodes     = {}
    Topology   = {}
    MaxEpoch  = 1
    VoteChoices <- MinimalVoteChoices

INIT Init
NEXT Next

INVARIANT Agreement
