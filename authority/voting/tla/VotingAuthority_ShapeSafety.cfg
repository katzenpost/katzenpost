\* TLC configuration: Shape's constants, checking safety instead of the shape
\* gate. Three mix layers of one node, one gateway, one service node, four
\* authorities of which one is Byzantine.
\*
\* EXPECTED: all invariants hold. Threshold is 3, so two quorums overlap in at
\* least 2 authorities and exceed the single Byzantine one, which is the
\* arithmetic Byzantine4 exhibits with Topology empty. A tally that leaves a
\* Topology group empty costs that authority its certificate and its document,
\* which is availability and not agreement, and Shape is the witness for it.
\*
\* Delivery is unrestricted here. Every other configuration that checks a safety
\* invariant with a non-empty Topology pins it to full delivery.
\*
\* Vote content is restricted to MinimalVoteAssignments, see the comment on it: a
\* pass under a restriction does not establish the invariant. The README says why
\* no unrestricted run of this shape exists.
\*
\* SYMMETRY is sound here. Topology is not empty, so Symmetry permutes only
\* authorities, and none of these invariants names one. Without it the same
\* search is 22,055,812 distinct states instead of 3,741,466.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {m1, m2, m3, g1, s1}
    Topology    = {{m1}, {m2}, {m3}, {g1}, {s1}}
    Couriers  = {}
    EchoServices = {}
    MaxEpoch  = 1
    VoteAssignments <- MinimalVoteAssignments

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UniqueConsensus
INVARIANT DescriptorValidity
