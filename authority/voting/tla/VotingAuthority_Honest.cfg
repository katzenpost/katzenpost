\* TLC configuration: honest-majority / crash-fault case, single epoch.
\* No Byzantine authorities. All invariants should hold.
\*
\* Run:
\*   java -jar tla2tools.jar -config VotingAuthority_Honest.cfg VotingAuthority.tla

CONSTANTS
    Auths     = {a1, a2, a3}
    Byzantine = {}
    Nodes     = {n1, n2}
    Topology   = {}
    MaxEpoch  = 1

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UniqueConsensus
INVARIANT DescriptorValidity
INVARIANT ChainConsistency
INVARIANT ChainGrounded
INVARIANT ConvergenceUnderFullDelivery
INVARIANT AllOrNoneUnderFullDelivery
INVARIANT NoHonestLeftOut
