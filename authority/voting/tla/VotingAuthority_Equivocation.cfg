\* TLC configuration: descriptor equivocation, one Byzantine authority among
\* four, the setting in which Agreement HOLDS.
\*
\* EXPECTED: TLC reports a ConvergenceUnderFullDelivery counterexample. Every
\* vote and certificate is delivered, yet the honest authorities compute
\* different documents, because the Byzantine authority sent them votes with
\* different descriptor sets and tallyVotes() counts a vote whether or not its
\* sender equivocated. This costs liveness, not safety.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {n1}
    Topology   = {}
    MaxEpoch  = 1

INIT Init
NEXT Next
SYMMETRY Symmetry

INVARIANT ConvergenceUnderFullDelivery
