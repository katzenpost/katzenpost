\* TLC configuration: the deployed shape of VotingAuthority_Namenlos, asking what
\* a signed consensus owes the pigeonhole path rather than its signers.
\*
\* EXPECTED: ShardableUnderFullDelivery violated. GetShards addresses K of the
\* four configured replicas per envelope and drops the ones a document omits, so
\* two disputed replicas already leave an envelope with no shard to reach. The
\* replicas are not a Topology group, nothing in getMyConsensus counts them, and
\* every authority signs such a document without noticing.
\*
\* This establishes nothing at these node counts: delivery is pinned to full
\* delivery and vote content to one contested pair.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {"cryptonymity", "windfall", "mixy", "omelas",
                 "oneeyedman", "reed", "wauland",
                 "allmixedup", "waulandgateway", "haywood", "gnunet",
                 "annares", "lilly", "waulandservice", "windfallservice",
                 "storagereplica0", "storagereplica1",
                 "storagereplica2", "storagereplica3"}
    Topology    = {{"cryptonymity", "windfall"}, {"mixy", "omelas"},
                   {"oneeyedman", "reed", "wauland"},
                   {"allmixedup", "waulandgateway", "haywood", "gnunet"},
                   {"annares", "lilly", "waulandservice", "windfallservice"}}
    MaxEpoch  = 1
    Couriers  = {"annares", "waulandservice", "windfallservice"}
    EchoServices = {"annares", "lilly", "waulandservice", "windfallservice"}
    VoteChoices     <- OnlyFullVotes
    CertChoices     <- OnlyFullCerts
    VoteAssignments <- PairVoteAssignments

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT ShardableUnderFullDelivery
