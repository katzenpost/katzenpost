\* TLC configuration: two Byzantine authorities among six.
\*
\* Threshold is 4, so two quorums overlap in 2 authorities. One Byzantine
\* authority is therefore tolerated at this size, as at four; two are not,
\* because the overlap no longer exceeds the number of faults. EXPECTED: TLC
\* reports an Agreement counterexample.
\*
\* Six authorities cannot be searched exhaustively, so vote delivery is
\* restricted to MinimalVoteChoices. That is sound for finding a
\* counterexample, see the comment on MinimalVoteChoices. It is not sound for
\* the one-fault case, which is why there is no six-authority configuration
\* asserting that Agreement holds; the overlap arithmetic gives that result and
\* Byzantine4 exhibits the mechanism at even N.

CONSTANTS
    Auths     = {a1, a2, a3, a4, a5, a6}
    Byzantine = {a5, a6}
    Nodes     = {}
    MixLayers   = {}
    MinPerLayer = 1
    RoleGroups  = {}
    MaxEpoch  = 1
    VoteChoices <- MinimalVoteChoices

INIT Init
NEXT Next

INVARIANT Agreement
