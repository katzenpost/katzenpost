\* TLC configuration: the document shape a consensus must have, as the
\* reference enforces it per epoch.
\*
\* Three mix layers holding one node each, one gateway and one service node.
\* MinPerLayer is 1, which is what IsDocumentWellFormed actually requires of a
\* layer. An authority whose tally leaves a layer, the gateways or the service
\* nodes empty computes no document at all rather than a document that differs
\* from its peers', because getMyConsensus refuses to sign a malformed one.
\*
\* EXPECTED: ConvergenceUnderFullDelivery is violated, and the counterexample
\* is an authority holding no document. Every vote and certificate is delivered
\* and the priors agree, so this is not message loss: one Byzantine authority
\* varying a single descriptor between peers takes that descriptor below
\* threshold in one honest authority's tally and empties its group.
\*
\* Vote content is restricted to MinimalVoteAssignments, which is sound for
\* finding a counterexample, see the comment on it.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {m1, m2, m3, g1, s1}
    MixLayers   = {{m1}, {m2}, {m3}}
    MinPerLayer = 1
    RoleGroups  = {{g1}, {s1}}
    MaxEpoch  = 1
    VoteAssignments <- MinimalVoteAssignments

INIT Init
NEXT Next

INVARIANT ConvergenceUnderFullDelivery
