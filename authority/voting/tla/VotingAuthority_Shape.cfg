\* TLC configuration: the shape gate, at the smallest shape that can trip it.
\* Three mix layers of one node, one gateway, one service node; a document needs
\* a node from each, and an authority whose tally leaves a group empty issues no
\* certificate and computes nothing.
\*
\* EXPECTED: AllOrNoneUnderFullDelivery violated. a1's own view lacks s1 while
\* a2 and a3 have it, and a4 sends s1 to a2 and a3 but withholds it from a1. s1
\* then has two votes at a1, below the threshold of three, so a1's service-node
\* group is empty: it issues no certificate and holds no document, while a2 and
\* a3 certify with a4 and hold one.
\*
\* This checked ConvergenceUnderFullDelivery, which is the wrong witness: it
\* fails here with Byzantine = {} too, since singleton groups make one node
\* missing from every honest view a malformed tally everywhere, so no adversary
\* is needed to leave everyone with nothing.
\*
\* Vote content is restricted to MinimalVoteAssignments, see the comment on it.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {m1, m2, m3, g1, s1}
    Topology    = {{m1}, {m2}, {m3}, {g1}, {s1}}
    MaxEpoch  = 1
    VoteAssignments <- MinimalVoteAssignments

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT AllOrNoneUnderFullDelivery
