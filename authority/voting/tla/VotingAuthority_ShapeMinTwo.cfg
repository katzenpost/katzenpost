\* TLC configuration: the shape the MinNodesPerLayer knob asks for.
\*
\* Two mix layers of two nodes each, one gateway and one service node, with
\* MinPerLayer = 2. That is the config default and it is the shape of the
\* deployed network's first two layers, which hold two mixes each. Nothing
\* applies it per epoch today: hasEnoughDescriptors and verifyTopology would,
\* and neither is called, so this configuration models the rule as written
\* rather than the rule as enforced.
\*
\* EXPECTED: ConvergenceUnderFullDelivery is violated. Losing agreement on one
\* descriptor is enough, because a two-node layer that needs two nodes has no
\* slack at all: the same equivocation that costs a MinPerLayer = 1 network a
\* layer only when both its nodes drop costs this one a layer when either does.
\*
\* Vote content is restricted to MinimalVoteAssignments, which is sound for
\* finding a counterexample, see the comment on it.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {m1, m2, m3, m4, g1, s1}
    MixLayers   = {{m1, m2}, {m3, m4}}
    MinPerLayer = 2
    RoleGroups  = {{g1}, {s1}}
    MaxEpoch  = 1
    VoteAssignments <- MinimalVoteAssignments

INIT Init
NEXT Next

INVARIANT ConvergenceUnderFullDelivery
