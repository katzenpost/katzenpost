\* TLC configuration: one Byzantine authority among three.
\*
\* EXPECTED: TLC reports an Agreement counterexample. Lossy delivery leaves the
\* two honest authorities with different views, hence different documents, and
\* the Byzantine authority signs BOTH, supplying the deciding second signature
\* for each.
\*
\* A simple-majority quorum of floor(N/2)+1 tolerates crash and omission
\* faults. Byzantine agreement additionally needs two quorums to overlap in
\* more than f authorities, i.e. 2*Threshold - N > f, which at N = 3, f = 1 it
\* does not (1 is not greater than 1). VotingAuthority_Byzantine4.cfg checks
\* the passing side of that boundary.

CONSTANTS
    Auths     = {a1, a2, a3}
    Byzantine = {a3}
    Nodes     = {n1}
    Topology   = {}
    MaxEpoch  = 1

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT Agreement
