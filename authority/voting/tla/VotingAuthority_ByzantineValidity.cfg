\* TLC configuration: one Byzantine authority among three, properties that
\* survive.
\*
\* Agreement fails in this setting (see VotingAuthority_Byzantine.cfg). These
\* properties need only Cardinality(Byzantine) < Threshold and are expected to
\* HOLD: a Byzantine authority can split the honest authorities, but it cannot
\* inject a descriptor that no honest authority accepted, and it cannot make
\* an honest authority chain onto a malformed shared-random chain.

CONSTANTS
    Auths     = {a1, a2, a3}
    Byzantine = {a3}
    Nodes     = {n1}
    Topology   = {}
    MaxEpoch  = 2

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT DescriptorValidity
INVARIANT ChainGrounded
