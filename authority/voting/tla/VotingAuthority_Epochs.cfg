\* TLC configuration: multi-epoch, no Byzantine authorities.
\*
\* Runs three consecutive epochs. Exercises the epoch boundary: authorities
\* that finalise chain onto their document, authorities that do not either
\* fetch it from a peer or restart from the zero value. Three epochs are the
\* minimum at which ChainGrounded can tell a stale chain from a fresh one.
\*
\* Expected: all invariants hold.

CONSTANTS
    Auths     = {a1, a2, a3}
    Byzantine = {}
    Nodes     = {n1}
    Topology   = {}
    MaxEpoch  = 3

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UniqueConsensus
INVARIANT DescriptorValidity
INVARIANT ChainConsistency
INVARIANT ChainGrounded
INVARIANT ConvergenceUnderFullDelivery
