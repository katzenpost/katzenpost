\* TLC configuration: the deployed network, as its published consensus shows it
\* at <https://status.namenlos.network/>. Three mix layers of two, two and three;
\* four gateways; four service nodes, three advertising a courier and all four an
\* echo; four storage replicas. Replicas are not a Topology group, because
\* IsDocumentWellFormed checks each replica descriptor and never counts them, but
\* they are tallied like any other descriptor and so are contestable. Four
\* authorities where the network runs six, so the threshold here is 3 of 4 rather
\* than 4 of 6.
\*
\* EXPECTED: NoHonestLeftOut violated, with every honest view well formed. Every
\* group has a spare, so no single disputed descriptor can empty one; two can, and
\* that is what this exhibits. One authority is left unable to certify while the
\* others hold a document.
\*
\* The other two claims say what a consensus owes its consumers rather than its
\* signers: that enough replicas survive for sharding to address K of them, and
\* that some node advertising each service survives. Nothing in getMyConsensus
\* checks either.
\*
\* This establishes nothing at these node counts: delivery is pinned to full
\* delivery and vote content to one contested pair. It exhibits what is reachable
\* where the network actually runs.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {"cryptonymity", "windfall", "mixy", "omelas", "oneeyedman", "reed", "wauland",
                 "allmixedup", "waulandgateway", "haywood", "gnunet",
                 "annares", "lilly", "waulandservice", "windfallservice",
                 "replica0", "replica1", "replica2", "replica3"}
    Topology    = {{"cryptonymity", "windfall"}, {"mixy", "omelas"},
                   {"oneeyedman", "reed", "wauland"},
                   {"allmixedup", "waulandgateway", "haywood", "gnunet"},
                   {"annares", "lilly", "waulandservice", "windfallservice"}}
    MaxEpoch  = 1
    Couriers        <- NamenlosCouriers
    EchoServices    <- NamenlosEcho
    VoteChoices     <- OnlyFullVotes
    CertChoices     <- OnlyFullCerts
    VoteAssignments <- PairVoteAssignments

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT OnlyFullCertsIsARestriction
INVARIANT ShardableUnderFullDelivery
INVARIANT ServicesSurviveUnderFullDelivery
INVARIANT NoHonestLeftOut
