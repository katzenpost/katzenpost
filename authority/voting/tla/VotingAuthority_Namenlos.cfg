\* TLC configuration: the shape gate at the deployed shape, with namenlos's
\* nodes and groups. Three mix layers of two, two and three, four gateways and
\* four service nodes. Storage replicas are left out because
\* IsDocumentWellFormed checks each replica descriptor and never counts them, so
\* they are never a group. Four authorities, where namenlos runs six, so the
\* threshold here is 3 of 4 rather than 4 of 6.
\*
\* EXPECTED: NoHonestLeftOut violated, with every honest view well formed. Every
\* group has a spare, so no single disputed descriptor can empty one; emptying
\* the thinnest group takes two, and this exhibits that. The trace: a1 and a2
\* lack m1b and a3 lacks m1a, every honest view still well formed, and a4 sends
\* every node to a2 and a3 while withholding m1a and m1b from a1. At a1, m1a has
\* two votes and m1b one, against a threshold of three, so mix layer 1 is empty
\* and a1 issues no certificate; at a2 and a3 m1a has three, so they certify with
\* a4 and hold a document with m1a and without m1b.
\*
\* This establishes nothing at these node counts: delivery and vote content are
\* restricted, and each authority's view is one of 2^|Nodes|. It exhibits that
\* the gate is reachable where the network actually runs.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {m0a, m0b, m1a, m1b, m2a, m2b, m2c, g1, g2, g3, g4, s1, s2, s3, s4}
    Topology    = {{m0a, m0b}, {m1a, m1b}, {m2a, m2b, m2c},
                   {g1, g2, g3, g4}, {s1, s2, s3, s4}}
    MaxEpoch  = 1
    VoteChoices     <- OnlyFullVotes
    CertChoices     <- OnlyFullCerts
    VoteAssignments <- PairVoteAssignments

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT OnlyFullCertsIsARestriction
INVARIANT NoHonestLeftOut
