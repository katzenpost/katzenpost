\* TLC configuration: one Byzantine authority among four.
\*
\* Threshold is 3, so two quorums overlap in at least 2 authorities, more than
\* the single Byzantine one. EXPECTED: all safety invariants hold, including
\* Agreement and UniqueConsensus.
\*
\* ConvergenceUnderFullDelivery is deliberately absent: it fails here, see
\* VotingAuthority_Equivocation.cfg.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {n1}
    Topology   = {}
    MaxEpoch  = 1

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UniqueConsensus
INVARIANT DescriptorValidity
INVARIANT ChainConsistency
INVARIANT ChainGrounded
