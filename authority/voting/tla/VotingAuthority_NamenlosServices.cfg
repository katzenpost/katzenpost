\* TLC configuration: the deployed shape of VotingAuthority_Namenlos, asking what
\* services a signed consensus still offers, and the safety invariants at a shape
\* no other configuration pins.
\*
\* EXPECTED: all invariants hold. Three nodes advertise a courier and four an
\* echo, so one contested pair cannot empty either; that is the provisioning
\* margin, not a condition getMyConsensus checks. Agreement, UniqueConsensus and
\* DescriptorValidity are here because, apart from ShapeSafety, every
\* configuration that checks them leaves Topology empty, and this is the only one
\* that checks them at the deployed shape.
\*
\* This establishes nothing at these node counts: delivery is pinned to full
\* delivery and vote content to one contested pair.

CONSTANTS
    Auths     = {a1, a2, a3, a4}
    Byzantine = {a4}
    Nodes     = {"cryptonymity", "windfall", "mixy", "omelas",
                 "oneeyedman", "reed", "wauland",
                 "allmixedup", "waulandgateway", "haywood", "gnunet",
                 "annares", "lilly", "waulandservice", "windfallservice",
                 "storagereplica0", "storagereplica1",
                 "storagereplica2", "storagereplica3"}
    Topology    = {{"cryptonymity", "windfall"}, {"mixy", "omelas"},
                   {"oneeyedman", "reed", "wauland"},
                   {"allmixedup", "waulandgateway", "haywood", "gnunet"},
                   {"annares", "lilly", "waulandservice", "windfallservice"}}
    MaxEpoch  = 1
    Couriers        <- NamenlosCouriers
    EchoServices    <- NamenlosEcho
    VoteChoices     <- OnlyFullVotes
    CertChoices     <- OnlyFullCerts
    VoteAssignments <- PairVoteAssignments

SPECIFICATION Spec
SYMMETRY Symmetry

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UniqueConsensus
INVARIANT DescriptorValidity
INVARIANT ServicesSurviveUnderFullDelivery
