# SPDX-License-Identifier: AGPL-3.0-only

name: interop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'
      - run: make interop
